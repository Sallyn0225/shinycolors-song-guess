<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!--
      战报预览页。开发期专用，不进构建产物 —— Vite 的 build input 只有 index.html。
      用法见 tools/ticket-preview/README.md。
    -->
    <title>战报预览 · dev</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Jost:wght@400;600;700&family=Noto+Sans+JP:wght@400;600;700&display=swap"
    />
    <style>
      body {
        margin: 0;
        padding: 24px;
        background: #d9d8e2;
        font: 13px/1.5 'Noto Sans JP', 'PingFang SC', sans-serif;
        color: #2b2c5e;
      }
      #cases { display: flex; gap: 28px; align-items: flex-start; }
      figure { margin: 0; width: 720px; flex: none; }
      /* 逻辑尺寸 720×1080，canvas 自身是 1440×2160 */
      canvas { width: 720px; height: 1080px; box-shadow: 0 8px 40px rgb(0 0 0 / 0.25); }
      figcaption { display: flex; flex-direction: column; gap: 2px; padding-top: 10px; }
      figcaption b { letter-spacing: 0.08em; }
      figcaption span { color: #55555f; }
    </style>
  </head>
  <body>
    <div id="cases"></div>
    <script type="module" src="/src/dev/ticketPreview.ts"></script>
  </body>
</html>
