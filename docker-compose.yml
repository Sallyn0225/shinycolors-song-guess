# 部署说明见 DEPLOY.md 的「Docker Compose 部署」一节。
#
# 首次使用：cp .env.example .env 并填好 DOMAIN / ACME_EMAIL，
# 再把构建好的 assets/ 放到本文件同级目录。

services:
  app:
    # 生产：拉 GHCR 上由 Actions 构建好的镜像（VPS 是 2C4G/5Mbps，
    # 不适合每次部署都在上面跑 pnpm install + vite build）。
    # 想本地构建就跑 `docker compose build`。
    image: ${APP_IMAGE:-ghcr.io/sallyn0225/shinycolors-song-guess:latest}
    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped

    # 用 tini 做 PID 1 收养孤儿进程。CMD 里已经是 exec 形式的 node，
    # SIGTERM 能直达，这里只是兜底
    init: true

    # 只发布到回环地址，公网碰不到——真正对外的是反代。
    #
    # 为什么发布而不是只 expose：很多机器上**已经有一个系统级反代**
    # （nginx / 系统 Caddy / 面板自带的 OpenResty）在占着 80/443。
    # 那种情况下反代不在这个 compose 网络里，够不着容器名，
    # 只能经宿主机回环。绑 127.0.0.1 而不是 0.0.0.0，公网仍然进不来。
    ports:
      - "127.0.0.1:${APP_PORT:-5179}:5179"

    environment:
      # 容器内仍监听 0.0.0.0，否则同网络的 caddy 连不进来
      HOST: 0.0.0.0
      PORT: "5179"
      # 有 Caddy 在前，必须开。不开的话 req.ip 是反代自己的地址，
      # 按 IP 的三项房间配额会从「每人」退化成「全局」——不报错，
      # 表现是几个人一起玩时有人建不了房。论证见 DEPLOY.md
      TRUST_PROXY: "1"
      # 封面走 CDN 的前缀，留空则封面由本进程伺服。值写在同目录 .env 里：
      #   PUBLIC_ASSET_BASE=https://cdn.example.com
      # 只对 coverUrl 生效（缩略图是前端相对路径，切片绝不走 CDN）——见 DEPLOY.md「CDN」一节
      PUBLIC_ASSET_BASE: ${PUBLIC_ASSET_BASE:-}

    volumes:
      # 曲库不进镜像：228MB 的商业音源派生物，且每次改代码重建都要重落一层。
      # **只读**——服务端只读不写，只读挂载是免费的加固
      - ./assets:/app/assets:ro

    healthcheck:
      # 打 /api/health 而不是探端口：它返回曲目数，
      # 所以「健康」等于曲库确实挂载成功了。忘了挂 assets 时容器会明确不健康，
      # 而不是起来了却是个空壳
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5179/api/health').then(r=>{if(!r.ok)process.exit(1);return r.json()}).then(j=>process.exit(j.songs>0?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # 自带的 Caddy，**默认不启用**。
  #
  #   裸机（80/443 空着）：  docker compose --profile caddy up -d
  #   已有系统反代：          docker compose up -d      ← 不要启用本服务
  #
  # 机器上已经有东西占着 80/443 时，这个服务会抢不到端口起不来，
  # 而且真起来了也会和现有站点打架。那种情况下把 app 的
  # 127.0.0.1:5179 挂到你现有的反代上即可，配置片段见 Caddyfile。
  caddy:
    profiles: ["caddy"]
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      # 不用 ${DOMAIN:?} 的必填写法：compose 会对整个文件做插值，
      # 哪怕本服务的 profile 没启用也一样求值，那样连
      # `docker compose up -d`（不带 caddy）都会先报错
      DOMAIN: ${DOMAIN:-}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # 证书必须持久化。不持久化的话每次重启都重新申请，
      # 很快会撞上 Let's Encrypt 的速率限制然后彻底签不出来
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
